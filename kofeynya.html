const $=s=>document.querySelector(s),app=$('#app'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function show(h){app.innerHTML=`<div class="screen">${h}</div>`;scrollTo({top:0,behavior:RM?'auto':'smooth'})}

function count(el,to,dur=1200){if(RM){el.textContent=to;return}const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/dur);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}
function confetti(n=160){if(RM)return;const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);
const cols=['#f0b43c','#c8834a','#3fa45b','#e0524d','#fff','#8f4f22'],P=[...Array(n)].map(()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.random()*6|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));let f=0;
(function loop(){x.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++f<180)requestAnimationFrame(loop);else x.clearRect(0,0,innerWidth,innerHeight)})()}

const TY={product:'Товар',benefit:'Выгода',question:'Частый вопрос',answer:'Как ответить',objection:'Возражение',prohibition:'Запрет'};
let draft=[];
async function rules(){const g=await api('rules_get');

const PREFIX=[["product",/^(товар|ассортимент|позиция|продукт)/],["benefit",/^(выгод|преимуществ|плюс)/],["question",/^(частый вопрос|вопрос)/],["answer",/^(как ответить|ответ|скрипт|фраза)/],["objection",/^возражени/],["prohibition",/^(запрет|нельзя|не допускается)/]];
const EXAMPLE=`Товар: Капучино 300 мл — 250 ₽
Выгода: двойной эспрессо из свежей обжарки, молоко 3,2%
Товар: Круассан — 150 ₽
Выгода: к любому кофе круассан со скидкой 20%
Частый вопрос: Почему у вас дороже, чем на вокзале? -> Ответ: У нас свежая обжарка и двойной эспрессо, а к кофе круассан со скидкой — попробуйте, разница чувствуется
Частый вопрос: А есть растительное молоко? -> Ответ: Да, овсяное и миндальное, доплата 50 ₽, готовим в отдельном питчере
Возражение: Дорого -> Ответ: Понимаю. Можно взять средний объём и круассан со скидкой — выйдет выгоднее
Возражение: Я подумаю -> Ответ: Конечно! Могу дать попробовать, а сегодня к кофе десерт со скидкой
Возражение: Долго ждать -> Ответ: Приготовлю за 3 минуты, а пока предложу присесть
Запрет: Спорить с гостем
Запрет: Говорить «не знаю»
Запрет: Пользоваться телефоном у стойки`;
const stems=t=>new Set((t.toLowerCase().replace(/ё/g,'е').match(/[а-яa-z0-9]+/g)||[]).filter(w=>w.length>2).map(w=>w.slice(0,5)));
const STOP=stems("это как что для или если уже есть так все еще можно нужно будет было очень у нас вас вам");
const minus=(a,b)=>new Set([...a].filter(x=>!b.has(x))),inter=(a,b)=>new Set([...a].filter(x=>b.has(x)));
const ptype=s=>{const l=s.toLowerCase().trim();for(const[k,rx]of PREFIX)if(rx.test(l))return k;return null};
function parseRules(text){const cards=[];for(const raw of (text||'').split(/\r?\n/)){let line=raw.trim().replace(/^[-•*\s]+/,'');if(line.length<2)continue;
 const cells=raw.split('\t').map(c=>c.trim()).filter(Boolean);if(cells.length&&['тип','type','категория','вид'].includes(cells[0].toLowerCase()))continue;let t,body,ans=null;
 if(cells.length>=2&&cells[0].length<25&&ptype(cells[0])){t=ptype(cells[0]);body=cells[1];ans=cells[2]||null}
 else{const m=line.split(/\s*(?:->|→|=>)\s*(?:ответ\s*:|как ответить\s*:)?\s*/i);const bf=m[0];ans=m.length>1?m.slice(1).join(' '):null;t=ptype(bf);body=t?bf.replace(/^\s*[^:—\-\t]{0,25}[:\t—]\s*/,'').trim():bf.trim();
  if(!t){const lo=body.toLowerCase();t=/^(не |нельзя)/.test(lo)?'prohibition':body.endsWith('?')?'question':/^[«"]/.test(body)?'objection':'product'}}
 body=body.trim();if(/^[«"]/.test(body)&&/[»"]$/.test(body))body=body.slice(1,-1);if(!body)continue;cards.push({type:t,text:body.slice(0,200),answer:(ans||'').slice(0,300)});if(cards.length>=60)break}return cards}
const GOOD=stems("понимаю попробуйте предложу выгоднее скидка свежая вкус могу конечно давайте рекомендую советую хотите акция десерт быстро минуты");
const RUDE=["не знаю","не моё","не мое","ваши проблемы","идите","нет и всё","как хотите","мне всё равно","мне все равно"];
const pick=a=>a[Math.random()*a.length|0];
function buildScript(cards,turns){const by={};Object.keys(TY).forEach(k=>by[k]=cards.filter(c=>c.type===k));const prod=pick(by.product.map(c=>c.text).concat(by.product.length?[]:['кофе'])).split(/\s+[—-]\s+/)[0];
 const gen=by.answer.map(c=>c.text).concat(by.benefit.map(c=>c.text)).join(' ');
 const st=[{kind:'Давит на цену',say:`${prod} — почему так дорого? Рядом дешевле.`,expect:by.objection.filter(c=>/дорог/i.test(c.text)).map(c=>c.answer).join(' ')+' '+by.benefit.map(c=>c.text).join(' ')},
 {kind:'Сомневается',say:`Не уверен, что ${prod.toLowerCase()} того стоит… Чем он лучше?`,expect:by.benefit.map(c=>c.text).join(' ')||gen}];
 const rest=by.question.map(c=>({kind:'Частый вопрос',say:c.text,expect:c.answer||gen})).concat(by.objection.filter(c=>!/дорог/i.test(c.text)).map(c=>({kind:'Возражение из списка',say:/[?!.]$/.test(c.text)?c.text:`«${c.text}»`,expect:c.answer||gen})));
 rest.sort(()=>Math.random()-.5);return st.concat(rest).slice(0,Math.max(3,Math.min(8,turns)))}
function scoreReply(reply,step,cards){const r=reply.trim(),lo=r.toLowerCase(),rs=minus(stems(r),STOP),exp=minus(stems(step.expect),STOP),hit=inter(rs,exp);let s=0;const notes=[],bad=[];
 if(exp.size){s+=Math.min(60,Math.floor(hit.size/Math.max(4,Math.min(exp.size,10))*90));if(hit.size)notes.push('опора на ваши правила')}
 if(inter(rs,GOOD).size){s+=20;notes.push('вежливое предложение')}if(r.length>=25)s+=15;if(r.includes('?')||/(хотите|давайте|предлож)/.test(lo)){s+=5;notes.push('вовлёк гостя')}
 const NEG=stems("нельзя говорить пользоваться не");for(const c of cards)if(c.type==='prohibition'){const ps=minus(minus(stems(c.text),STOP),NEG);const plain=c.text.toLowerCase().replace('говорить ','').replace(/[«»"]/g,'').trim();
  if((ps.size&&inter(ps,rs).size>=Math.max(1,ps.size>>1))||(plain&&lo.includes(plain)))bad.push(c.text)}
 if(RUDE.some(x=>lo.includes(x)))bad.push('грубый или отстранённый ответ');if(r.length<8)bad.push('слишком коротко');if(bad.length)s=Math.min(s,25);return{score:Math.max(0,Math.min(100,s)),notes,bad}}
const react=s=>pick(s>=60?["Хм, звучит разумно.","Ладно, убедили.","О, это интересно.","Окей, допустим."]:s>=35?["Ну не знаю…","Это как-то не убедительно.","И всё?"]:["Ладно, я, пожалуй, пойду в другое место.","Неприятно. Пойду, наверное."]);
function summarize(log,review){const total=Math.round(log.reduce((a,t)=>a+t.score,0)/Math.max(1,log.length));const q=s=>s.replace(/[«»]/g,'');
 return{score:total,passed:total>=70,worked:log.filter(t=>t.score>=60&&t.notes.length).slice(0,3).map(t=>`${t.voice?'🎤 ':''}«${t.reply.slice(0,110)}${t.reply.length>110?'…':''}» — ${t.notes.join(', ')}`),
 lost:log.filter(t=>t.score<45).slice(0,3).map(t=>`На «${q(t.say).slice(0,70)}» — `+(t.bad.length?t.bad.join('; '):'ответ не убедил')),
 better:review?[...log].sort((a,b)=>a.score-b.score).slice(0,3).filter(t=>t.score<70).map(t=>({say:q(t.say),better:(t.expect.trim()||'Признать сомнение гостя, назвать выгоду и предложить конкретный вариант').slice(0,200)})):[],log}}

async function api(n,b={}){const s=U.settings;switch(n){
 case'rules_example':return{cards:parseRules(EXAMPLE),text:EXAMPLE};
 case'rules_parse':{let t=b.text||'';if(b.file)try{t=await fileText(b.file)}catch(e){return{error:'Не удалось прочитать файл. Поддерживаются .txt, .csv, .docx, .xlsx'}}const c=parseRules(t);return c.length?{cards:c}:{error:'Не нашла правил в тексте'}}
 case'rules_confirm':{const c=(b.cards||[]).filter(x=>TY[x.type]&&String(x.text).trim()).slice(0,60);if(!c.length)return{error:'Нет карточек'};U.rules=c;save();return{ok:true,count:c.length}}

 case'settings':Object.assign(s,b);save();return{settings:s};
 case'chat_start':{if(!U.rules)return{error:'rules'};if(U.chats.length>=s.attempts)return{error:'attempts',used:U.chats.length};const sc=buildScript(U.rules,s.turns);U.chat={script:sc,i:0,log:[]};return{say:sc[0].say,kind:sc[0].kind,i:1,total:sc.length,timer:s.timer,attempt:U.chats.length+1,attempts:s.attempts}}
 case'chat_reply':{const ch=U.chat;if(!ch)return{error:'нет диалога'};const txt=String(b.text||'').slice(0,500),step=ch.script[ch.i],r=scoreReply(txt,step,U.rules);ch.log.push({say:step.say,reply:txt,voice:!!b.voice,score:r.score,notes:r.notes,bad:r.bad,expect:step.expect});ch.i++;

async function unzip(buf){const dv=new DataView(buf),u8=new Uint8Array(buf);let e=buf.byteLength-22;while(e>0&&dv.getUint32(e,true)!==0x06054b50)e--;const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
 for(let i=0;i<n;i++){const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);const name=new TextDecoder().decode(u8.slice(p+46,p+46+nl));p+=46+nl+xl+cl;
  files[name]=async()=>{const lnl=dv.getUint16(off+26,true),lxl=dv.getUint16(off+28,true),d=u8.slice(off+30+lnl+lxl,off+30+lnl+lxl+cs);if(m===0)return new TextDecoder().decode(d);const ds=new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return new Response(ds).text()}}return files}
async function fileText(f){const n=f.name.toLowerCase(),buf=await f.arrayBuffer(),X=s=>new DOMParser().parseFromString(s,'application/xml');
 if(n.endsWith('.docx')){const z=await unzip(buf);const d=X(await z['word/document.xml']());return[...d.getElementsByTagName('w:p')].map(p=>[...p.getElementsByTagName('w:t')].map(t=>t.textContent).join('')).join('\n')}
 if(n.endsWith('.xlsx')){const z=await unzip(buf);const ss=z['xl/sharedStrings.xml']?[...X(await z['xl/sharedStrings.xml']()).getElementsByTagName('si')].map(si=>si.textContent):[];const sh=Object.keys(z).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort()[0];
  return[...X(await z[sh]()).getElementsByTagName('row')].map(r=>[...r.getElementsByTagName('c')].map(c=>{const v=c.getElementsByTagName('v')[0];return c.getAttribute('t')==='s'&&v?ss[+v.textContent]:(v?v.textContent:c.textContent)}).join('\t')).join('\n')}
 let t=new TextDecoder('utf-8').decode(buf);if(t.includes('\uFFFD'))t=new TextDecoder('windows-1251').decode(buf);if(n.endsWith('.csv')){const d=(t.split(';').length>t.split(',').length)?';':',';t=t.split(/\r?\n/).map(l=>l.split(d).map(x=>x.replace(/^"|"$/g,'')).join('\t')).join('\n')}return t}

 sr.onresult=e=>{let tmp='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)fin+=e.results[i][0].transcript+' ';else tmp+=e.results[i][0].transcript}$('#in').value=(before?before+' ':'')+(fin+tmp).trim();VOICE=true};
